[package]
name = "ai-isochrone"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
roaring-landmask = "0.10"
rayon = "1.8"
ndarray = "0.15"
itertools = "0.12"
petgraph = "0.6"
ordered-float = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
geo-types = "0.7"
geo = "0.27"
chrono = "0.4"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

# GUI pour visualisation (features optionnelles)
# Note: walkers 0.51 utilise egui 0.33, donc on aligne toutes les versions
eframe = { version = "0.33", default-features = false, features = ["glow"], optional = true }
egui = { version = "0.33", optional = true }
egui_extras = { version = "0.33", features = ["image", "all_loaders"], optional = true }
image = { version = "0.24", optional = true }
poll-promise = { version = "0.3", optional = true }
walkers = { version = "0.51", optional = true }

[features]
default = []
gui = ["eframe", "egui", "egui_extras", "image", "poll-promise", "walkers"]

[[bin]]
name = "ai-isochrone-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[dev-dependencies]
criterion = "0.5"
