<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOTA Isochrone Routing</title>
    <link data-trunk rel="rust" href="../Cargo.toml" data-target-name="ai_isochrone" data-wasm-opt="z" data-cargo-features="web" data-cargo-no-default-features="true" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        #ai_isochrone_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #eee;
            font-family: system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading SOTA Isochrone Routing...</div>
    <canvas id="ai_isochrone_canvas"></canvas>
    <script type="module">
        import init, { WebHandle } from './ai_isochrone.js';
        async function run() {
            await init();
            const canvas = document.getElementById('ai_isochrone_canvas');
            const handle = new WebHandle();
            await handle.start(canvas, 47.55, -3.48, 60.39, 5.32);
            document.getElementById('loading').style.display = 'none';
        }
        run().catch(console.error);
    </script>
</body>
</html>
